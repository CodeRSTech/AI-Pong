site_name: AI-Pong
site_description: Neural-network + genetic algorithm Pong project
repo_url: https://github.com/CodeRSTech/AI-Pong
repo_name: CodeRSTech/AI-Pong

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            separate_signature: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Docs:
      - Overview: docs-overview.md
  - API Reference: api/index.md