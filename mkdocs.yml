site_name: AI-Pong
site_description: Neural-network + genetic algorithm Pong project
repo_url: https://github.com/CodeRSTech/AI-Pong
repo_name: CodeRSTech/AI-Pong

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/docs_reference.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          load_external_modules: false
          options:
            allow_inspection: false
            docstring_style: google
            inherited_members: false
            filters: ["!^_", "^__init__$"]
            show_if_no_docstring: true
            show_signature_annotations: true
            show_root_heading: false
            show_source: false
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Overview:
      - Overview: docs-overview.md
      - Architecture: architecture.md
      - Roadmap: ROADMAP.md
      - Releases:
        - 1.4.0: releases/1.4.0.md
  - Guides:
      - Training: training.md
      - Web demo: web-demo.md
  - Components:
      - Coordinate system: coordinates.md
      - Fitness: fitness.md
  - API Reference: api/index.md