<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%" style="background:#090b14; font-family:&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif;">
  <defs>
    <!-- Synapse Line Gradient -->
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Cyan Glow for AI -->
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle circuit glow -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Synapse Network Nodes (7 -> 8 -> 6 -> 2 Topology) -->
  <g opacity="0.28" stroke="url(#synapseGrad)" stroke-width="1.2">
    <!-- Left Synapses -->
    <line x1="50" y1="45" x2="110" y2="35" />
    <line x1="50" y1="75" x2="110" y2="35" />
    <line x1="50" y1="105" x2="110" y2="85" />
    <line x1="50" y1="135" x2="110" y2="125" />
    <line x1="50" y1="75" x2="110" y2="85" />
    <line x1="110" y1="35" x2="165" y2="65" />
    <line x1="110" y1="85" x2="165" y2="65" />
    <line x1="110" y1="125" x2="165" y2="115" />
    <line x1="110" y1="85" x2="165" y2="115" />

    <!-- Right Synapses -->
    <line x1="515" y1="55" x2="570" y2="40" />
    <line x1="515" y1="95" x2="570" y2="90" />
    <line x1="515" y1="135" x2="570" y2="130" />
    <line x1="570" y1="40" x2="630" y2="75" />
    <line x1="570" y1="90" x2="630" y2="75" />
    <line x1="570" y1="130" x2="630" y2="110" />
  </g>

  <!-- Network Node Vertices -->
  <g opacity="0.65">
    <circle cx="50" cy="45" r="3.5" fill="#38bdf8" />
    <circle cx="50" cy="75" r="3.5" fill="#38bdf8" />
    <circle cx="50" cy="105" r="3.5" fill="#38bdf8" />
    <circle cx="50" cy="135" r="3.5" fill="#38bdf8" />
    <circle cx="110" cy="35" r="4" fill="#a855f7" />
    <circle cx="110" cy="85" r="4" fill="#a855f7" />
    <circle cx="110" cy="125" r="4" fill="#a855f7" />
    <circle cx="165" cy="65" r="4.5" fill="#38bdf8" />
    <circle cx="165" cy="115" r="4.5" fill="#38bdf8" />

    <circle cx="515" cy="55" r="3.5" fill="#a855f7" />
    <circle cx="515" cy="95" r="3.5" fill="#38bdf8" />
    <circle cx="515" cy="135" r="3.5" fill="#a855f7" />
    <circle cx="570" cy="40" r="4" fill="#34d399" />
    <circle cx="570" cy="90" r="4" fill="#38bdf8" />
    <circle cx="570" cy="130" r="4" fill="#34d399" />
    <circle cx="630" cy="75" r="5" fill="#34d399" />
    <circle cx="630" cy="110" r="5" fill="#34d399" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(340, 116)">
    <!-- Circuit connection bar under text -->
    <path d="M -195,16 L 195,16" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
    <circle cx="-195" cy="16" r="3" fill="#38bdf8" filter="url(#circuitGlow)" />
    <circle cx="195" cy="16" r="3" fill="#34d399" filter="url(#circuitGlow)" />

    <text x="0" y="0" text-anchor="middle" font-size="68" font-weight="900" fill="#f8fafc" letter-spacing="4">
      <tspan fill="#38bdf8" filter="url(#aiGlow)">AI</tspan> PONG
    </text>
  </g>

  <!-- Tagline -->
  <text x="340" y="162" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="4">
    EVOLUTIONARY ALGORITHMS
  </text>
</svg>