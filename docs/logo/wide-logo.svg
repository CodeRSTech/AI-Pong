<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%" style="background:#060b08; font-family:&#39;Courier New&#39;, Courier, monospace;">
  <defs>
    <!-- Phosphor Synapse Line Gradient -->
    <linearGradient id="phosphorSynapse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Terminal Phosphor Glow -->
    <filter id="terminalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Glow -->
    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Synapse Network (7 -> 8 -> 6 -> 2 Architecture) -->
  <g opacity="0.32" stroke="url(#phosphorSynapse)" stroke-width="1.2">
    <!-- Left Layer Synapses -->
    <line x1="50" y1="45" x2="110" y2="35" />
    <line x1="50" y1="75" x2="110" y2="35" />
    <line x1="50" y1="105" x2="110" y2="85" />
    <line x1="50" y1="135" x2="110" y2="125" />
    <line x1="50" y1="75" x2="110" y2="85" />
    <line x1="110" y1="35" x2="165" y2="65" />
    <line x1="110" y1="85" x2="165" y2="65" />
    <line x1="110" y1="125" x2="165" y2="115" />
    <line x1="110" y1="85" x2="165" y2="115" />

    <!-- Right Layer Synapses -->
    <line x1="515" y1="55" x2="570" y2="40" />
    <line x1="515" y1="95" x2="570" y2="90" />
    <line x1="515" y1="135" x2="570" y2="130" />
    <line x1="570" y1="40" x2="630" y2="75" />
    <line x1="570" y1="90" x2="630" y2="75" />
    <line x1="570" y1="130" x2="630" y2="110" />
  </g>

  <!-- Network Node Vertices -->
  <g opacity="0.75" filter="url(#nodeGlow)">
    <circle cx="50" cy="45" r="3.5" fill="#16a34a" />
    <circle cx="50" cy="75" r="3.5" fill="#16a34a" />
    <circle cx="50" cy="105" r="3.5" fill="#16a34a" />
    <circle cx="50" cy="135" r="3.5" fill="#16a34a" />
    <circle cx="110" cy="35" r="4" fill="#22c55e" />
    <circle cx="110" cy="85" r="4" fill="#22c55e" />
    <circle cx="110" cy="125" r="4" fill="#22c55e" />
    <circle cx="165" cy="65" r="4.5" fill="#4ade80" />
    <circle cx="165" cy="115" r="4.5" fill="#4ade80" />

    <circle cx="515" cy="55" r="3.5" fill="#22c55e" />
    <circle cx="515" cy="95" r="3.5" fill="#4ade80" />
    <circle cx="515" cy="135" r="3.5" fill="#22c55e" />
    <circle cx="570" cy="40" r="4" fill="#4ade80" />
    <circle cx="570" cy="90" r="4" fill="#86efac" />
    <circle cx="570" cy="130" r="4" fill="#4ade80" />
    <circle cx="630" cy="75" r="5" fill="#86efac" />
    <circle cx="630" cy="110" r="5" fill="#86efac" />
  </g>

  <!-- Center Wordmark Block -->
  <g transform="translate(340, 112)">
    <text x="0" y="0" text-anchor="middle" font-size="62" font-weight="900" fill="#22c55e" filter="url(#terminalGlow)" letter-spacing="4">
      AI<tspan fill="#86efac">::</tspan>PONG
    </text>
  </g>

  <!-- Tagline -->
  <text x="340" y="152" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700" letter-spacing="5" opacity="0.85" filter="url(#terminalGlow)">
    EVOLUTIONARY ALGORITHMS
  </text>
</svg>