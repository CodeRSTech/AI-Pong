<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Two-point crossover in AI-Pong</title>
  <desc id="desc">Two cut points delimit a contiguous interval in the ordered layer outputs. Reciprocal offspring inherit that interval from opposite parents and the rest of their network from the other parent.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #334155; }
      .tiny { font-size: 11px; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .layer { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .conn { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .parentA { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .parentB { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.5; }
      .slice { fill: #fbbf24; fill-opacity: .42; stroke: #d97706; stroke-width: 1.5; }
      .cut { stroke: #be123c; stroke-width: 2.5; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1000" height="620" rx="18" fill="#ffffff"/>
  <text x="38" y="47" class="title">Two-point crossover: exchange a middle slice</text>
  <text x="38" y="73" class="subtitle">The network view is illustrative; the selected interval follows layer-output order in the implementation.</text>

  <rect x="32" y="96" width="936" height="322" rx="14" class="panel"/>
  <text x="54" y="129" class="label">Parent A</text>
  <text x="54" y="294" class="label">Parent B</text>

  <g aria-label="Parent A network">
    <path d="M209 198 H262 M378 198 H431 M547 198 H600" class="conn"/>
    <rect x="112" y="169" width="97" height="58" rx="9" class="layer parentA"/>
    <rect x="262" y="162" width="116" height="72" rx="9" class="layer parentA"/>
    <rect x="431" y="162" width="116" height="72" rx="9" class="layer parentA"/>
    <rect x="600" y="169" width="97" height="58" rx="9" class="layer parentA"/>
    <text x="160" y="193" text-anchor="middle" class="label">7</text><text x="160" y="213" text-anchor="middle" class="tiny">inputs</text>
    <text x="320" y="193" text-anchor="middle" class="label">8</text><text x="320" y="213" text-anchor="middle" class="tiny">hidden 1</text>
    <text x="489" y="193" text-anchor="middle" class="label">6</text><text x="489" y="213" text-anchor="middle" class="tiny">hidden 2</text>
    <text x="648" y="193" text-anchor="middle" class="label">2</text><text x="648" y="213" text-anchor="middle" class="tiny">actions</text>
  </g>

  <g aria-label="Parent B network with the example interval highlighted">
    <path d="M209 357 H262 M378 357 H431 M547 357 H600" class="conn"/>
    <rect x="112" y="328" width="97" height="58" rx="9" class="layer parentB"/>
    <rect x="262" y="321" width="116" height="72" rx="9" class="layer parentB"/>
    <rect x="431" y="321" width="116" height="72" rx="9" class="layer parentB"/>
    <rect x="600" y="328" width="97" height="58" rx="9" class="layer parentB"/>
    <text x="160" y="352" text-anchor="middle" class="label">7</text><text x="160" y="372" text-anchor="middle" class="tiny">inputs</text>
    <text x="320" y="352" text-anchor="middle" class="label">8</text><text x="320" y="372" text-anchor="middle" class="tiny">hidden 1</text>
    <text x="489" y="352" text-anchor="middle" class="label">6</text><text x="489" y="372" text-anchor="middle" class="tiny">hidden 2</text>
    <text x="648" y="352" text-anchor="middle" class="label">2</text><text x="648" y="372" text-anchor="middle" class="tiny">actions</text>
    <path d="M379 321 L447 321 L467 393 L399 393 Z" class="slice"/>
  </g>

  <line x1="329" y1="146" x2="403" y2="407" class="cut"/>
  <line x1="397" y1="146" x2="471" y2="407" class="cut"/>
  <text x="305" y="151" class="tiny" fill="#be123c">cut 1</text>
  <text x="409" y="151" class="tiny" fill="#be123c">cut 2</text>
  <text x="731" y="180" class="small">Two cut points enclose</text>
  <text x="731" y="200" class="small">one contiguous interval.</text>
  <text x="731" y="340" class="small">The highlighted interval</text>
  <text x="731" y="360" class="small">comes from Parent B for</text>
  <text x="731" y="380" class="small">Child A (example).</text>

  <rect x="32" y="439" width="936" height="151" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="473" class="label">Reciprocal offspring</text>
  <text x="54" y="505" class="small">Child A = Parent A outside the interval + Parent B inside it</text>
  <text x="54" y="532" class="small">Child B = Parent B outside the interval + Parent A inside it</text>
  <text x="54" y="566" class="tiny">Selected neurons carry their incoming weights and biases; outgoing connections from selected neurons in the preceding layer follow that parent too.</text>
  <text x="54" y="583" class="tiny">The code selects neurons in concatenated layer-output order, not by cutting the drawing geometrically. Mutation follows crossover.</text>
</svg>
