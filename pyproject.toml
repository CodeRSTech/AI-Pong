[project]
name = "ai-pong"
version = "1.4.0"
description = "A neural network and genetic algorithm that learns to play Pong."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["arcade", "numpy", "loguru", "torch", "torchvision"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.24,<1", "pymdown-extensions>=10.2,<12.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
