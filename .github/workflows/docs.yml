name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-user-site-docs
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: https://coderstech.github.io/projects/AI-Pong/docs/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-bootswatch

      - name: Build documentation
        run: mkdocs build --strict

      - name: Check publishing credentials
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::Set PAGES_TOKEN with Contents read/write access to CodeRSTech/coderstech.github.io."
            exit 1
          fi

      - name: Check out user Pages site
        uses: actions/checkout@v4
        with:
          repository: CodeRSTech/coderstech.github.io
          ref: main
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages-repository

      - name: Sync documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          for path in pages-repository/projects pages-repository/projects/AI-Pong pages-repository/projects/AI-Pong/docs; do
            if [ -L "$path" ]; then
              echo "::error::Refusing to publish through a symlink: $path"
              exit 1
            fi
          done
          mkdir -p pages-repository/projects/AI-Pong/docs
          rsync -a --delete site/ pages-repository/projects/AI-Pong/docs/

      - name: Commit and publish documentation
        working-directory: pages-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects/AI-Pong/docs
          if git diff --cached --quiet; then
            echo "Documentation is unchanged."
            exit 0
          fi
          git commit -m "Update AI-Pong documentation from ${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
